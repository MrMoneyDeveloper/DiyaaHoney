{% extends 'base.html' %}
{% block title %}Create User - DiyaaHoney{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-lg border-0 bg-body-tertiary">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h5 mb-0">Create user</h1>
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('dashboard.manage_users') }}">Back</a>
        </div>
        <p class="text-body-secondary small">Set credentials and a role for the new account.</p>
        <form method="post" class="d-grid gap-3">
          <div>
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" class="form-control" required value="{{ form_username }}">
          </div>
          <div>
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" name="password" class="form-control" required>
          </div>
          <div>
            <label class="form-label" for="role">Role</label>
            <select id="role" name="role" class="form-select">
              <option value="viewer" {% if form_role == 'viewer' %}selected{% endif %}>Viewer</option>
              <option value="admin" {% if form_role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Create user</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
