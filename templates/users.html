{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">User Management</h2>
<div class="row g-4">
  <div class="col-md-5">
    <form method="post" class="card p-3 shadow-sm">
      <h3 class="mb-3">Create User</h3>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" class="form-control" required value="{{ form_username }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" name="password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="role">Role</label>
        <select id="role" name="role" class="form-select">
          <option value="viewer" {% if form_role == 'viewer' %}selected{% endif %}>viewer</option>
          <option value="admin" {% if form_role == 'admin' %}selected{% endif %}>admin</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">Create user</button>
    </form>
  </div>
  <div class="col-md-7">
    <div class="card p-3 shadow-sm">
      <h3 class="mb-3">Existing Users</h3>
      <table class="table table-striped">
        <thead>
          <tr>
            <th scope="col">Username</th>
            <th scope="col">Role</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.username }}</td>
              <td>{{ user.role }}</td>
            </tr>
          {% else %}
            <tr>
              <td colspan="2">No users found.</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
