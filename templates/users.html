{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">User Management</h2>
<p class="mb-3 text-muted">
  Use the <a href="{{ url_for('dashboard.create_user') }}">Create User</a> page to add new accounts.
</p>
<div class="card p-3 shadow-sm">
  <h3 class="mb-3">Existing Users</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col">Role</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.role }}</td>
        </tr>
      {% else %}
        <tr>
          <td colspan="2">No users found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
